services:
  comment:
    build:
      context: .
      args:
        SERVICE: comment
    env_file:
      - .env
    ports:
      - "${PORT_COMMENT_SERVICE}:${PORT_COMMENT_SERVICE}"

  poster:
    build:
      context: .
      args:
        SERVICE: poster
    env_file:
      - .env
    ports:
      - "${PORT_POSTER_SERVICE}:${PORT_POSTER_SERVICE}"

  user:
    build:
      context: .
      args:
        SERVICE: user
    env_file:
      - .env
    ports:
      - "${PORT_USER_SERVICE}:${PORT_USER_SERVICE}"

  # Сервисы пока используют in-memory хранилища;
  # postgres оставлен под подключение БД в будущем.
  db:
    image: postgres:15
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "${PORT_DATA_BASE}:${PORT_DATA_BASE}"

volumes:
  pgdata:
