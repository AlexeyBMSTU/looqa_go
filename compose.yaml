services:
  comment:
    build:
      context: .
      args:
        SERVICE: comment
    env_file:
      - .env
    environment:
      # Внутри сети compose база доступна как db:5432.
      # Локально (make run-*) переменная не задана — сервис работает
      # на in-memory хранилище.
      DB_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "${PORT_COMMENT_SERVICE}:${PORT_COMMENT_SERVICE}"
    depends_on:
      db:
        condition: service_healthy

  poster:
    build:
      context: .
      args:
        SERVICE: poster
    env_file:
      - .env
    environment:
      DB_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "${PORT_POSTER_SERVICE}:${PORT_POSTER_SERVICE}"
    depends_on:
      db:
        condition: service_healthy

  user:
    build:
      context: .
      args:
        SERVICE: user
    env_file:
      - .env
    environment:
      DB_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "${PORT_USER_SERVICE}:${PORT_USER_SERVICE}"
    depends_on:
      db:
        condition: service_healthy

  # Postgres — хранилище сервисов (таблицы User/Comment/Poster).
  # Схема и адаптация таблиц — в migrations/ (применение: make migrate).
  db:
    image: postgres:15
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "${PORT_DATA_BASE}:5432"

  pgadmin:
    image: dpage/pgadmin4
    env_file:
      - .env
    ports:
      - "${PORT_PGADMIN}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

volumes:
  pgdata:
  pgadmin_data:
