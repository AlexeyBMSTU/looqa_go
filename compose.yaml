services:
  comment:
    build:
      context: .
      args:
        SERVICE: comment
    env_file:
      - .env
    environment:
      # Внутри сети compose база доступна как db:5432.
      DB_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Публичные ключи auth-сервиса — для локальной проверки JWT.
      AUTH_JWKS_URL: http://auth:${PORT_AUTH_SERVICE}/jwks
    ports:
      - "${PORT_COMMENT_SERVICE}:${PORT_COMMENT_SERVICE}"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started

  poster:
    build:
      context: .
      args:
        SERVICE: poster
    env_file:
      - .env
    environment:
      DB_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTH_JWKS_URL: http://auth:${PORT_AUTH_SERVICE}/jwks
    ports:
      - "${PORT_POSTER_SERVICE}:${PORT_POSTER_SERVICE}"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started

  user:
    build:
      context: .
      args:
        SERVICE: user
    env_file:
      - .env
    environment:
      DB_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTH_JWKS_URL: http://auth:${PORT_AUTH_SERVICE}/jwks
    ports:
      - "${PORT_USER_SERVICE}:${PORT_USER_SERVICE}"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started

  bridge:
    build:
      context: .
      args:
        SERVICE: bridge
    env_file:
      - .env
    environment:
      AUTH_JWKS_URL: http://auth:${PORT_AUTH_SERVICE}/jwks
    ports:
      - "${PORT_BRIDGE_SERVICE}:${PORT_BRIDGE_SERVICE}"
    depends_on:
      auth:
        condition: service_started

  auth:
    build:
      context: .
      args:
        SERVICE: auth
    env_file:
      - .env
    environment:
      DB_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MONGO_URI: mongodb://mongo:27017
    ports:
      - "${PORT_AUTH_SERVICE}:${PORT_AUTH_SERVICE}"
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy

  swagger:
    image: swaggerapi/swagger-ui
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    volumes:
      - ./openapi.yaml:/spec/openapi.yaml:ro
    ports:
      - "${PORT_SWAGGER}:8080"

  # Postgres — хранилище сервисов (таблицы User/Comment/Poster).
  # Схема и адаптация таблиц — в migrations/ (применение: make migrate).
  db:
    image: postgres:15
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "${PORT_DATA_BASE}:5432"

  pgadmin:
    image: dpage/pgadmin4
    env_file:
      - .env
    ports:
      - "${PORT_PGADMIN}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

  # MongoDB — хранилище токенов аутентификации (база looqa, коллекция tokens).
  # Истёкшие токены удаляются автоматически TTL-индексом по expires_at.
  mongo:
    image: mongo:8
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "${PORT_MONGO}:27017"

volumes:
  pgdata:
  pgadmin_data:
  mongodata:
