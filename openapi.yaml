openapi: 3.0.3

info:
  title: looqa API
  version: 2.0.0
  description: |
    API микросервисов looqa — пять независимых сервисов, каждый на своём порту:

    | Сервис | База | Что делает |
    |---|---|---|
    | comment | `http://localhost:8080` | комментарии |
    | user | `http://localhost:8081` | пользователи |
    | poster | `http://localhost:8082` | посты |
    | auth | `http://localhost:8084` | регистрация, вход, токены-сессии |
    | bridge | `http://localhost:8084` | прокси к LLM (ai-bridge) |

    Порты по умолчанию, настраиваются в `.env` (`PORT_COMMENT_SERVICE`,
    `PORT_USER_SERVICE`, `PORT_POSTER_SERVICE`, `PORT_AUTH_SERVICE`,
    `PORT_BRIDGE_SERVICE`).

    У каждого пути задан собственный `servers` — базовый URL его сервиса,
    поэтому запросы из Swagger UI / Postman уходят в нужный порт.

    Хранилище — postgres (таблицы `User`, `Comment`, `Poster`, `Credential`).
    `author_id` комментариев и постов ссылается на существующего
    пользователя (FK): при удалении пользователя его комментарии
    и посты удаляются каскадом.

    Аутентификация — JWT. `POST /reg` создаёт пользователя и учётные
    данные (email + bcrypt-хеш пароля, таблица `Credential`), `POST /login`
    выдаёт пару токенов: короткоживущий access (JWT, алгоритм EdDSA,
    `AUTH_ACCESS_TTL`, по умолчанию 15 минут) и одноразовый refresh
    (`AUTH_REFRESH_TTL`, по умолчанию 30 дней; в MongoDB хранится только
    его sha256-хеш). Ручки `/reg`, `/login`, `/refresh` ограничены по
    частоте (`AUTH_RATE_LIMIT`, по умолчанию 30 запросов/мин с IP).

    ВСЕ ручки остальных сервисов (comment/user/poster/bridge) требуют
    access-токен в заголовке `Authorization: Bearer <access>`.
    Ресурсные сервисы проверяют его локально: забирают публичный ключ
    с `GET /jwks` и кэшируют. Ответ 401 — токен не передан, битый,
    просрочен или сессия отозвана; 503 — auth-сервис недоступен.

    `POST /refresh` ротирует refresh-токен (новая пара в той же сессии).
    Повторное использование уже ротированного refresh — признак кражи:
    вся сессия отзывается. `POST /logout` (с валидным access) отзывает
    сессию целиком; сам access отзывается только истечением.

    bridge пересылает сообщение в LLM: креды провайдера передаются
    в заголовках запроса (`X-API-Key`, `X-Model`, `X-Provider-URL`),
    ответ модели возвращается как есть.

tags:
  - name: comment
    description: Сервис комментариев (порт 8080)
  - name: user
    description: Сервис пользователей (порт 8081)
  - name: poster
    description: Сервис постов (порт 8082)
  - name: auth
    description: Регистрация, вход, JWT-токены и JWKS (порт 8084)
  - name: bridge
    description: Прокси к LLM через ai-bridge (порт 8084)

paths:
  # ----------------------------------------------------------------- comment
  /comments:
    servers:
      - url: http://localhost:8080
    get:
      tags: [comment]
      operationId: getCommentAll
      summary: Список всех комментариев
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
    post:
      tags: [comment]
      operationId: createComment
      summary: Создать комментарий
      security:
        - bearerAuth: []
      description: |
        `author_id` должен ссылаться на существующего пользователя —
        иначе 400 (нарушение внешнего ключа).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Comment'
            example:
              id: 9b2f6a1e-4c3d-4e5f-8a90-1a2b3c4d5e6f
              author_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              likes_count: 5
      responses:
        '200':
          description: Создан (тело ответа — null)
          content:
            application/json:
              schema:
                nullable: true
        '400':
          description: Некорректный JSON, id уже занят или author_id не существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthUnavailable'

  /comments/{id}:
    servers:
      - url: http://localhost:8080
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [comment]
      operationId: getCommentById
      summary: Комментарий по id
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
    delete:
      tags: [comment]
      operationId: deleteComment
      summary: Удалить комментарий
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Удалён (тела нет)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthUnavailable'

  # -------------------------------------------------------------------- user
  /users:
    servers:
      - url: http://localhost:8081
    get:
      tags: [user]
      operationId: getUserAll
      summary: Список всех пользователей
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
    post:
      tags: [user]
      operationId: createUser
      summary: Создать пользователя
      security:
        - bearerAuth: []
      description: |
        `id` лучше передавать свой (сгенерированный UUID): без него
        создастся запись с нулевым UUID, и повторный такой POST
        закончится конфликтом.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
            example:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              first_name: Ivan
              last_name: Petrov
              avatar_url: https://example.com/avatar.png
      responses:
        '200':
          description: Создан (тело ответа — null)
          content:
            application/json:
              schema:
                nullable: true
        '400':
          description: Некорректный JSON или id уже занят
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthUnavailable'

  /users/{id}:
    servers:
      - url: http://localhost:8081
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [user]
      operationId: getUserById
      summary: Пользователь по id
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
    delete:
      tags: [user]
      operationId: deleteUser
      summary: Удалить пользователя (каскадом удалятся его посты и комментарии)
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Удалён (тела нет)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthUnavailable'

  # ------------------------------------------------------------------ poster
  /posters:
    servers:
      - url: http://localhost:8082
    get:
      tags: [poster]
      operationId: getPosterAll
      summary: Список всех постов
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Poster'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
    post:
      tags: [poster]
      operationId: createPoster
      summary: Создать пост
      security:
        - bearerAuth: []
      description: |
        `author_id` должен ссылаться на существующего пользователя —
        иначе 400 (нарушение внешнего ключа). `publication_at` можно
        не передавать — подставится текущее время.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Poster'
            example:
              id: 5f0d2a3b-9c8e-4d7a-b1f2-6e3d5c7b9a01
              name: Первый пост
              text: Текст поста
              author_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              comments_count: 0
              likes_count: 0
      responses:
        '200':
          description: Создан (тело ответа — null)
          content:
            application/json:
              schema:
                nullable: true
        '400':
          description: Некорректный JSON, id уже занят или author_id не существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthUnavailable'

  /posters/{id}:
    servers:
      - url: http://localhost:8082
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [poster]
      operationId: getPosterById
      summary: Пост по id
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Poster'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
    delete:
      tags: [poster]
      operationId: deletePoster
      summary: Удалить пост
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Удалён (тела нет)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthUnavailable'

  # -------------------------------------------------------------------- auth
  /reg:
    servers:
      - url: http://localhost:8084
    post:
      tags: [auth]
      operationId: register
      summary: Зарегистрироваться
      description: |
        Создаёт пользователя и учётные данные для входа (email + пароль).
        Пароль хранится только в виде bcrypt-хеша, email приводится
        к нижнему регистру. `id` генерирует сервис — передавать его не нужно,
        `avatar_url` при регистрации не заполняется.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: ivan@example.com
              password: secret123
              first_name: Ivan
              last_name: Petrov
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Некорректный JSON, невалидный email или пароль короче 8 символов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /login:
    servers:
      - url: http://localhost:8084
    post:
      tags: [auth]
      operationId: login
      summary: Войти и получить пару токенов
      description: |
        Проверяет email и пароль и выдаёт access (JWT, EdDSA) и refresh.
        Неизвестный email и неверный пароль отвечают одинаковым 401,
        чтобы по ответу нельзя было перебирать адреса.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: ivan@example.com
              password: secret123
      responses:
        '200':
          description: Пара токенов выдана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /logout:
    servers:
      - url: http://localhost:8084
    post:
      tags: [auth]
      operationId: logout
      summary: Выйти (отозвать сессию)
      description: |
        Отзывает сессию: все refresh-токены её семейства удаляются,
        последующий `POST /refresh` по ним вернёт 401. Действующий access
        мгновенно не отзывается — он истечёт сам (`AUTH_ACCESS_TTL`);
        для logout нужен ещё валидный access-токен.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Сессия отозвана (тела нет)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /refresh:
    servers:
      - url: http://localhost:8084
    post:
      tags: [auth]
      operationId: refresh
      summary: Обновить пару токенов
      description: |
        Обменивает refresh-токен на новую пару (access + refresh)
        той же сессии. Refresh одноразовый: при обмене он ротируется.
        Предъявление уже ротированного refresh — признак кражи:
        вся сессия отзывается, и все её токены дальше отвечают 401.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refresh_token: 6a1b2c3d4e5f60718293a4b5c6d7e8f9a0b1c2d3e4f5061728394a5b6c7d8e9f
      responses:
        '200':
          description: Новая пара токенов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Refresh неизвестен, истёк или переиспользован (сессия отозвана)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /jwks:
    servers:
      - url: http://localhost:8084
    get:
      tags: [auth]
      operationId: getJwks
      summary: Публичные ключи для проверки access-токенов
      description: |
        JWKS (RFC 7517) с публичным ключом Ed25519. Ресурсные сервисы
        забирают его и кэшируют, чтобы проверять JWT локально без
        запросов к auth-сервису. Ключ меняется после перезапуска
        auth-сервиса (kid в ответе совпадает с kid в заголовке JWT).
      responses:
        '200':
          description: Набор ключей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWKS'
        '500':
          $ref: '#/components/responses/InternalError'

  # ------------------------------------------------------------------ bridge
  /message:
    servers:
      - url: http://localhost:8084
    post:
      tags: [bridge]
      operationId: postMessage
      summary: Отправить сообщение LLM
      description: |
        Пересылает сообщение в LLM через библиотеку ai-bridge и возвращает
        ответ модели. Креды провайдера передаются в заголовках каждого
        запроса; на сервере они не сохраняются — в памяти кэшируются только
        открытые соединения по ключу.
      parameters:
        - name: X-API-Key
          in: header
          required: true
          description: API-ключ провайдера LLM
          schema:
            type: string
        - name: X-Model
          in: header
          required: true
          description: Название модели
          schema:
            type: string
        - name: X-Provider-URL
          in: header
          required: true
          description: Базовый URL API провайдера
          schema:
            type: string
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequest'
            example:
              message: Объясни коротко, что такое замыкание в Go
      responses:
        '200':
          description: Ответ модели (JSON-строка)
          content:
            application/json:
              schema:
                type: string
              example: 'Замыкание — функция, захватившая переменные внешней области...'
        '400':
          description: Некорректный JSON или отсутствует один из заголовков X-API-Key/X-Model/X-Provider-URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthUnavailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'JWT access-токен из POST /login: Authorization: Bearer <access>'

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: UUID записи
      schema:
        type: string
        format: uuid
      example: 9b2f6a1e-4c3d-4e5f-8a90-1a2b3c4d5e6f

  responses:
    BadRequest:
      description: Некорректный id (не UUID) или запись не найдена
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Внутренняя ошибка сервиса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Access-токен не передан, битый, просрочен или сессия отозвана
      headers:
        WWW-Authenticate:
          description: Схема аутентификации (RFC 9110)
          schema:
            type: string
            example: 'Bearer realm="looqa"'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AuthUnavailable:
      description: Ресурсный сервис не смог забрать ключи с GET /jwks (auth-сервис недоступен) — повторите позже
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Слишком много запросов с одного IP (лимит AUTH_RATE_LIMIT, по умолчанию 30/мин)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Email уже зарегистрирован
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
        avatar_url:
          type: string
          format: uri
      example:
        id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        first_name: Ivan
        last_name: Petrov
        avatar_url: https://example.com/avatar.png

    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        author_id:
          type: string
          format: uuid
          description: UUID существующего пользователя (FK на User)
        likes_count:
          type: integer
          format: int64
      example:
        id: 9b2f6a1e-4c3d-4e5f-8a90-1a2b3c4d5e6f
        author_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        likes_count: 5

    Poster:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Заголовок поста
        text:
          type: string
        author_id:
          type: string
          format: uuid
          description: UUID существующего пользователя (FK на User)
        comments_count:
          type: integer
          format: int64
        likes_count:
          type: integer
          format: int64
        publication_at:
          type: string
          format: date-time
          description: При создании можно не передавать — подставится текущее время
      example:
        id: 5f0d2a3b-9c8e-4d7a-b1f2-6e3d5c7b9a01
        name: Первый пост
        text: Текст поста
        author_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        comments_count: 0
        likes_count: 0
        publication_at: '2026-11-13T12:00:00Z'

    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
      example:
        code: 400
        message: bad request

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: Приводится к нижнему регистру и валидируется
        password:
          type: string
          format: password
          minLength: 8
          description: Минимум 8 символов, хранится как bcrypt-хеш
        first_name:
          type: string
        last_name:
          type: string
      example:
        email: ivan@example.com
        password: secret123
        first_name: Ivan
        last_name: Petrov
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      example:
        email: ivan@example.com
        password: secret123
    MessageRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Текст сообщения для LLM
      example:
        message: Объясни коротко, что такое замыкание в Go

    TokenPair:
      type: object
      properties:
        access_token:
          type: string
          description: JWT (EdDSA) — передавать всем сервисам в заголовке Authorization
        refresh_token:
          type: string
          description: Одноразовый токен для POST /refresh (ротация при каждом обмене)
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          format: int64
          description: Секунды до истечения access-токена
      example:
        access_token: eyJhbGciOiJFZERTQSIsImtpZCI6IjIxM2Y0NTY3ODlhYiJ9.eyJpc3MiOiJsb29xYS1hdXRoIn0.MzxQ...
        refresh_token: 6a1b2c3d4e5f60718293a4b5c6d7e8f9a0b1c2d3e4f5061728394a5b6c7d8e9f
        token_type: Bearer
        expires_in: 900
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: Refresh-токен из POST /login или предыдущего POST /refresh
      example:
        refresh_token: 6a1b2c3d4e5f60718293a4b5c6d7e8f9a0b1c2d3e4f5061728394a5b6c7d8e9f
    JWKS:
      type: object
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/JWK'
    JWK:
      type: object
      properties:
        kty:
          type: string
          example: OKP
        crv:
          type: string
          example: Ed25519
        x:
          type: string
          description: Публичный ключ (base64url)
        use:
          type: string
          example: sig
        alg:
          type: string
          example: EdDSA
        kid:
          type: string
          description: Идентификатор ключа — совпадает с kid в заголовке JWT
